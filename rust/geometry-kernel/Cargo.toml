[package]
name = "ratiolab-geometry"
version = "0.1.16"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false
description = "Shared geometry and nominal calculations for RatioLab"

[lib]
name = "ratiolab_geometry"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ratiolab-geometry"
path = "src/main.rs"

[dependencies]
astro-float = { version = "=0.9.6", default-features = false, features = ["std"] }
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
