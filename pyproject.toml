[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiolab"
version = "0.1.4"
description = "Parametric gears and reducers with a GTK 4 and OpenGL preview"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [{name = "NoOneExceptEnderk"}]
# GTK, PyGObject, Cairo and libepoxy are installed together by the native
# package manager. Declaring PyGObject as a pip dependency would select a
# different ABI or attempt an unsupported native build on Windows.
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/NoOneExceptEnderk/RatioLab"
Issues = "https://github.com/NoOneExceptEnderk/RatioLab/issues"

[project.scripts]
ratiolab = "ratiolab_cli:main"
ratiolab-install-desktop = "install_desktop:main"
ratiolab-mcp = "ratiolab_mcp:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src", "build_support" = "build-support"}
packages = ["ratiolab_resources"]
py-modules = [
  "app", "app_paths", "release_version", "updates", "update_ui", "assemblies", "bom", "cad_export", "catalog", "connection", "export_transaction",
  "bevel_geometry", "differential_wrist", "engineering", "external_programs", "fusion_connection", "geartrains", "geometry", "gl_loader", "gui_workflow",
  "hardware", "hardware_catalog", "install_desktop", "io_controls",
  "component_geometry", "components_ui", "selected_export", "pair_assembly", "combination_search", "combination_search_ui", "collision_geometry", "interference", "interference_ui", "kinematics", "motion", "motion_controls", "mounting", "preview3d",
  "project_document", "project_ui", "package_export", "printed_shaft", "profile_export", "ratiolab_agent", "ratiolab_mcp", "ratiolab_checks", "ratiolab_cli", "result_controls", "solid_geometry",
  "special_drives", "worm_geometry", "wave_geometry", "wave_envelope", "tooth_profiles", "standard_parts", "stl_export", "workspace_ui", "workspace_tools",
]

[tool.setuptools.cmdclass]
build_py = "build_support.ratiolab_build.BuildPy"

[tool.setuptools.package-data]
ratiolab_resources = ["*.json", "branding/*.json", "branding/*.png", "icons/hicolor/index.theme", "icons/hicolor/*/apps/*.png", "fusion_addin/RatioLabBridge/*.py", "fusion_addin/RatioLabBridge/*.manifest"]
