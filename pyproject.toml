[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiolab"
version = "0.2.4"
description = "Parametric gears and reducers with a GTK 4 and OpenGL preview"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [{name = "NoOneExceptEnderk"}]
# GTK, PyGObject, Cairo and libepoxy are installed together by the native
# package manager. Declaring PyGObject as a pip dependency would select a
# different ABI or attempt an unsupported native build on Windows.
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/NoOneExceptEnderk/RatioLab"
Issues = "https://github.com/NoOneExceptEnderk/RatioLab/issues"

[project.scripts]
ratiolab = "ratiolab_cli:main"
ratiolab-install-desktop = "install_desktop:main"
ratiolab-mcp = "ratiolab_mcp:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src", "build_support" = "build-support"}
packages = ["ratiolab_resources"]
py-modules = [
  "component_sheets", "component_sheets_ui", "sheet_pdf",
  "cad_contract", "solidcraft_recipe", "parallel_multistage", "rack_geometry",
  "app", "app_paths", "ui_language", "language_ui", "file_menu_ui", "settings_ui", "precision_ui", "theme_preferences", "theme_editor_ui", "keyboard_shortcuts", "shortcut_capture_ui", "mouse_navigation", "release_version", "release_notes", "updates", "update_download", "update_install", "update_macos", "update_receipt", "update_ui", "assemblies", "bom", "cad_export", "curved_cad", "curved_cylindrical", "catalog", "connection", "export_transaction",
  "bevel_geometry", "differential_wrist", "engineering", "cylindrical_validation", "external_programs", "export_feedback", "fusion_connection", "geartrains", "geometry", "geometry_quality", "geometry_error_budget", "quality_ui", "geometry_refresh", "parameter_errors", "gl_loader", "gui_workflow", "parameter_help", "parameter_help_ui", "parameter_help_diagrams",
  "hardware", "hardware_catalog", "install_desktop", "io_controls", "backdrivability", "gear_measurement", "gear_measurement_ui", "backlash_solver", "backlash_ui",
  "component_geometry", "components_ui", "empty_fields", "selected_export", "pair_assembly", "combination_search", "combination_search_ui", "collision_geometry", "interference", "interference_ui", "kinematics", "motion", "motion_controls", "mounting", "preview3d", "tool_capabilities",
  "project_document", "project_ui", "package_export", "parallel_multistage", "printed_shaft", "profile_export", "ratiolab_agent", "ratiolab_mcp", "ratiolab_checks", "ratiolab_cli", "result_controls", "solid_geometry",
  "precise_numbers", "ratio_display", "rust_geometry", "rust_surfaces", "special_drives", "bevel_pair", "hypoid_geometry", "rack_geometry", "face_geometry", "face_herringbone", "wolfrom", "worm_geometry", "wave_geometry", "wave_envelope", "tooth_profiles", "tooth_tips", "tooth_tip_preview", "tooth_tip_ui", "internal_mesh", "standard_parts", "stl_export", "workspace_ui", "workspace_tools", "model_catalog_ui", "navigation_cube", "view_navigation",
]

[tool.setuptools.cmdclass]
build_py = "build_support.ratiolab_build.BuildPy"
bdist_wheel = "build_support.ratiolab_build.BdistWheel"

[tool.setuptools.package-data]
ratiolab_resources = ["native/*", "*.json", "branding/*.json", "branding/*.png", "model-catalog/*.png", "icons/hicolor/index.theme", "icons/hicolor/*/apps/*.png", "fusion_addin/RatioLabBridge/*.py", "fusion_addin/RatioLabBridge/*.manifest"]
