name: Native installers with GTK included

on:
  workflow_dispatch:
    inputs:
      native_gui:
        description: Also require a real GPU/desktop GL check on Windows and macOS
        type: boolean
        default: false
  push:
    paths:
      - '**.py'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'packaging/**'
      - 'scripts/**'
      - 'src/**'
      - 'build-support/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'LICENSE'
      - 'COPYRIGHT'
      - '.github/workflows/installers.yml'
  pull_request:
    paths:
      - '**.py'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'packaging/**'
      - 'scripts/**'
      - 'src/**'
      - 'build-support/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'LICENSE'
      - 'COPYRIGHT'
      - '.github/workflows/installers.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GSK_RENDERER: cairo
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libpython3.12 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-girepository-2.0 libepoxy0 libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 libegl-mesa0 fontconfig binutils dpkg-dev xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/bundle-env"
          "$RUNNER_TEMP/bundle-env/bin/python" -m pip install -r packaging/requirements-build.txt
      - name: Build the native bundle and verify real rendering
        run: |
          xvfb-run -a "$RUNNER_TEMP/bundle-env/bin/python" scripts/build-bundle.py --gui
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_bundles.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_release_verification.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_self_test_profile.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_gui_runner.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_external_programs.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_installers_linux.py' -v
      - name: Create actual Linux installers
        run: |
          "$RUNNER_TEMP/bundle-env/bin/python" scripts/package-linux.py --bundle dist/bundles/linux-x86_64/RatioLab --deb
      - name: Install from the downloadable run file and test the installed app
        run: |
          sh dist/installers/RatioLab-*-linux-x86_64.run --yes --no-desktop --destination "$RUNNER_TEMP/RatioLab installed Ω"
          xvfb-run -a "$RUNNER_TEMP/RatioLab installed Ω/RatioLab" --self-test-gui --report "$RUNNER_TEMP/linux-installed.json"
          cat "$RUNNER_TEMP/linux-installed.json"
          "$RUNNER_TEMP/bundle-env/bin/python" scripts/check-installed-mcp.py "$RUNNER_TEMP/RatioLab installed Ω/RatioLab-MCP" --report "$RUNNER_TEMP/linux-mcp.json"
          sh "$RUNNER_TEMP/RatioLab installed Ω/uninstall.sh"
          test ! -d "$RUNNER_TEMP/RatioLab installed Ω"
          mkdir -p "$RUNNER_TEMP/deb-extracted"
          dpkg-deb -x dist/installers/ratiolab_*_amd64.deb "$RUNNER_TEMP/deb-extracted"
          "$RUNNER_TEMP/deb-extracted/opt/ratiolab/RatioLab" --self-test --report "$RUNNER_TEMP/deb-runtime.json"
      - name: Upgrade an older installed release through the production helper
        env:
          RATIOLAB_CI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/bundle-env/bin/python" scripts/check-installed-update.py --new-installer dist/installers/RatioLab-*-linux-x86_64.run --baseline 0.2.2 --work-dir "$RUNNER_TEMP/native-update-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratiolab-linux-verification
          path: |
            ${{ runner.temp }}/linux-installed.json
            ${{ runner.temp }}/linux-installed.stderr.log
            ${{ runner.temp }}/linux-mcp.json
            ${{ runner.temp }}/native-update-check/update-result.json
            ${{ runner.temp }}/native-update-check/update-failure.json
            ${{ runner.temp }}/native-update-check/old-version.txt
            ${{ runner.temp }}/native-update-check/waiting-version.txt
            ${{ runner.temp }}/native-update-check/new-version.txt
            ${{ runner.temp }}/native-update-check/*.log
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/helper.log
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/ready
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/armed
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/cancel
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/result
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/status
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/runtime-version.txt
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/runtime-check.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ratiolab-linux-x86_64-installers
          path: dist/installers/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - name: Expose native Rust tools to MSYS2 Python
        shell: pwsh
        run: |
          "RATIOLAB_CARGO=$env:USERPROFILE\.cargo\bin\cargo.exe" >> $env:GITHUB_ENV
          "RUSTC=$env:USERPROFILE\.cargo\bin\rustc.exe" >> $env:GITHUB_ENV
          "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-angleproject
      - name: Build using the native UCRT64 Python and PyInstaller
        shell: msys2 {0}
        run: |
          export PYGI_DLL_PATH="$(cygpath -w /ucrt64/bin)"
          /ucrt64/bin/python.exe scripts/build-bundle.py
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_bundles.py' -v
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_release_verification.py' -v
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_self_test_profile.py' -v
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_gui_runner.py' -v
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_external_programs.py' -v
          echo "RATIOLAB_NATIVE_PYTHON=$(cygpath -w /ucrt64/bin/python.exe)" >> "$GITHUB_ENV"
      - name: Compile the real per-user Inno Setup installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Install, test and uninstall without MSYS2 on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist/installers/*-setup.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'RatioLab installed Ω'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $destination + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:GI_TYPELIB_PATH, Env:PYGI_DLL_PATH, Env:PYTHONPATH, Env:PYTHONHOME -ErrorAction SilentlyContinue
          $report = Join-Path $env:RUNNER_TEMP 'windows-installed.json'
          $process = Start-Process -FilePath "$destination\RatioLab.exe" -ArgumentList @('--self-test', '--report', ('"' + $report + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed runtime failed' }
          $result = Get-Content $report -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.self_test -ne 'passed' -or -not $result.bundled) { throw 'Installed app did not prove bundled GTK' }
          if (@($result.features.PSObject.Properties).Count -ne 6 -or @($result.features.PSObject.Properties | Where-Object Value -ne 'passed').Count -ne 0) { throw 'Installed new features failed' }
          Get-Content $report
          $python = $env:RATIOLAB_NATIVE_PYTHON
          $guiArguments = @('scripts/check-installed-gui.py', "$destination\RatioLab.exe", "$env:RUNNER_TEMP\installed-gui-check")
          if ('${{ inputs.native_gui }}' -eq 'true') { $guiArguments += '--require' }
          & $python @guiArguments
          if ($LASTEXITCODE -ne 0) { throw 'Installed GUI verification failed' }
          & $python scripts/check-installed-mcp.py "$destination\RatioLab-MCP.exe" --report "$env:RUNNER_TEMP\installed-gui-check\mcp-result.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP verification failed' }
          $process = Start-Process -FilePath "$destination\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path "$destination\RatioLab.exe") { throw 'Uninstall left the application executable' }
      - name: Upgrade an older installed release through the production helper
        env:
          RATIOLAB_CI_GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installers/*-setup.exe | Select-Object -First 1).FullName
          & $env:RATIOLAB_NATIVE_PYTHON scripts/check-installed-update.py --new-installer $installer --baseline 0.2.2 --work-dir "$env:RUNNER_TEMP\native-update-check"
          if ($LASTEXITCODE -ne 0) { throw 'Native installed update verification failed' }
      - name: Diagnose runtime provenance after a Windows packaging failure
        if: failure()
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $roots = & $vswhere -all -products '*' -property installationPath
          foreach ($root in $roots) {
            Write-Output "Visual Studio installation: $root"
            Get-ChildItem "$root\VC\Redist\MSVC" -Filter vcruntime140.dll -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              $_.FullName
              $_.VersionInfo | Select-Object FileVersion,ProductVersion,CompanyName,OriginalFilename
              Get-FileHash $_.FullName -Algorithm SHA256
            }
            Get-ChildItem "$root\Licenses" -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length
          }
          $runtime = "$env:WINDIR\System32\vcruntime140.dll"
          if (Test-Path $runtime) {
            (Get-Item $runtime).VersionInfo | Select-Object FileVersion,ProductVersion,CompanyName,OriginalFilename
            Get-FileHash $runtime -Algorithm SHA256
            Get-AuthenticodeSignature $runtime | Select-Object Status,SignerCertificate
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ratiolab-windows-notices-diagnostics
          path: work/bundle-build/windows-x86_64/notices
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratiolab-windows-gui-verification
          path: |
            ${{ runner.temp }}/installed-gui-check/*
            ${{ runner.temp }}/native-update-check/update-result.json
            ${{ runner.temp }}/native-update-check/update-failure.json
            ${{ runner.temp }}/native-update-check/old-version.txt
            ${{ runner.temp }}/native-update-check/waiting-version.txt
            ${{ runner.temp }}/native-update-check/new-version.txt
            ${{ runner.temp }}/native-update-check/*.log
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/helper.log
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/ready
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/armed
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/cancel
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/result
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/status
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/runtime-version.txt
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/runtime-check.json
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/setup.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ratiolab-windows-x86_64-installer
          path: dist/installers/*
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      # Hosted macOS compositors may stall in GSK's software GPU pipeline.
      # This changes only the GTK shell; GtkGLArea still proves native OpenGL.
      GSK_RENDERER: cairo
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - name: Install a coherent Homebrew native build runtime
        run: |
          brew install pygobject3 gtk4 gobject-introspection
          . scripts/macos-python.sh
          python=$(choose_macos_python)
          "$python" -m venv --system-site-packages "$RUNNER_TEMP/bundle-env"
          "$RUNNER_TEMP/bundle-env/bin/python" -m pip install -r packaging/requirements-build.txt
      - name: Build and check the native app bundle
        run: |
          "$RUNNER_TEMP/bundle-env/bin/python" scripts/build-bundle.py
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_bundles.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_release_verification.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_self_test_profile.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_gui_runner.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/bundle-env/bin/python" -m unittest discover -s tests -p 'test_external_programs.py' -v
          codesign --verify --deep --strict dist/bundles/macos-${{ matrix.arch }}/RatioLab.app
      - name: Build the actual drag-to-Applications DMG
        env:
          RATIOLAB_BUILD_PYTHON: ${{ runner.temp }}/bundle-env/bin/python
        run: sh scripts/package-macos.sh
      - name: Mount, copy and test without Homebrew on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/dmg-mount" "$RUNNER_TEMP/installed app Ω"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg-mount" dist/installers/*-${{ matrix.arch }}.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/dmg-mount" || true' EXIT
          ditto "$RUNNER_TEMP/dmg-mount/RatioLab.app" "$RUNNER_TEMP/installed app Ω/RatioLab.app"
          env -u PYTHONPATH -u PYTHONHOME -u GI_TYPELIB_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH PATH=/usr/bin:/bin:/usr/sbin:/sbin "$RUNNER_TEMP/installed app Ω/RatioLab.app/Contents/MacOS/RatioLab" --self-test --report "$RUNNER_TEMP/macos-installed.json"
          cat "$RUNNER_TEMP/macos-installed.json"
          "$RUNNER_TEMP/bundle-env/bin/python" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert len(r["features"]) == 6 and set(r["features"].values()) == {"passed"}' "$RUNNER_TEMP/macos-installed.json"
          require_gui=''
          if [ '${{ inputs.native_gui }}' = true ]; then require_gui='--require'; fi
          env -u PYTHONPATH -u PYTHONHOME -u GI_TYPELIB_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH PATH=/usr/bin:/bin:/usr/sbin:/sbin "$RUNNER_TEMP/bundle-env/bin/python" scripts/check-installed-gui.py "$RUNNER_TEMP/installed app Ω/RatioLab.app/Contents/MacOS/RatioLab" "$RUNNER_TEMP/installed-gui-check" $require_gui
          env -u PYTHONPATH -u PYTHONHOME -u GI_TYPELIB_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH PATH=/usr/bin:/bin:/usr/sbin:/sbin "$RUNNER_TEMP/bundle-env/bin/python" scripts/check-installed-mcp.py "$RUNNER_TEMP/installed app Ω/RatioLab.app/Contents/MacOS/RatioLab-MCP" --report "$RUNNER_TEMP/installed-gui-check/mcp-result.json"
          codesign --verify --deep --strict "$RUNNER_TEMP/installed app Ω/RatioLab.app"
          rm -rf "$RUNNER_TEMP/installed app Ω/RatioLab.app"
      - name: Upgrade an older installed release through the production helper
        env:
          RATIOLAB_CI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/bundle-env/bin/python" scripts/check-installed-update.py --new-installer dist/installers/*-${{ matrix.arch }}.dmg --baseline 0.2.2 --work-dir "$RUNNER_TEMP/native-update-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratiolab-macos-${{ matrix.arch }}-gui-verification
          path: |
            ${{ runner.temp }}/installed-gui-check/*
            ${{ runner.temp }}/native-update-check/update-result.json
            ${{ runner.temp }}/native-update-check/update-failure.json
            ${{ runner.temp }}/native-update-check/old-version.txt
            ${{ runner.temp }}/native-update-check/waiting-version.txt
            ${{ runner.temp }}/native-update-check/new-version.txt
            ${{ runner.temp }}/native-update-check/*.log
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/helper.log
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/ready
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/armed
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/cancel
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/result
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/status
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/runtime-version.txt
            ${{ runner.temp }}/native-update-check/cache/ratiolab/updates/install-handoffs/*/runtime-check.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ratiolab-macos-${{ matrix.arch }}-dmg
          path: dist/installers/*
          if-no-files-found: error
