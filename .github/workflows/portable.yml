name: Portable Python distribution

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_gui:
        description: Also require desktop OpenGL rendering on Windows and macOS runners
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - name: Install native GTK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-4.0 libepoxy0 xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/ratiolab-env"
          "$RUNNER_TEMP/ratiolab-env/bin/python" -m pip install build 'setuptools>=77' wheel 'mpmath==1.3.0'
      - name: Build and verify the shared native and WebAssembly kernel
        run: |
          python3 scripts/build-rust-engine.py --target all
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Require native and actual Wasm Python geometry regressions
        run: |
          "$RUNNER_TEMP/ratiolab-env/bin/python" scripts/check-rust-engine.py --report "$RUNNER_TEMP/kernel-core.json"
      - name: Require display-backed kernel and Surface detail regressions
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GSK_RENDERER: cairo
        run: |
          dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/ratiolab-env/bin/python" scripts/check-rust-engine.py --gui --report "$RUNNER_TEMP/kernel-gui.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratiolab-kernel-regressions
          path: |
            ${{ runner.temp }}/kernel-core.json
            ${{ runner.temp }}/kernel-gui.json
      - name: Build sdist and wheel from sdist
        run: |
          "$RUNNER_TEMP/ratiolab-env/bin/python" -m build
          "$RUNNER_TEMP/ratiolab-env/bin/python" scripts/verify-artifacts.py dist
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_release_verification.py' -v
      - name: Test Fusion client and bridge from source
        run: |
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_fusion_connection.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_fusion_bridge.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_fusion_wine.py' -v
      - name: Test Fusion GTK controls with a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GSK_RENDERER: cairo
        run: |
          PYTHONPATH=src xvfb-run -a "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_fusion_gui.py' -v
      - name: Install wheel outside the checkout and render with Mesa
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          "$RUNNER_TEMP/ratiolab-env/bin/python" -m pip install --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/ratiolab-checks"
          cp scripts/installed_smoke.py tests/test_portability.py tests/test_connection.py tests/test_preview3d.py tests/test_stl_export.py tests/test_agent.py tests/test_mcp.py scripts/check-installed-mcp.py "$RUNNER_TEMP/ratiolab-checks/"
          chmod -R a-w "$RUNNER_TEMP/ratiolab-env/lib/"*/site-packages
          cd "$RUNNER_TEMP/ratiolab-checks"
          xvfb-run -a "$RUNNER_TEMP/ratiolab-env/bin/python" installed_smoke.py --gui --forbid-root "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/ratiolab-env/bin/python" check-installed-mcp.py "$RUNNER_TEMP/ratiolab-env/bin/python" --module
          xvfb-run -a "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest test_portability test_connection test_preview3d test_stl_export test_agent test_mcp -v
      - uses: actions/upload-artifact@v4
        with:
          name: ratiolab-linux-python-distribution
          path: dist/*

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - name: Expose native Rust tools to MSYS2 Python
        shell: pwsh
        run: |
          "RATIOLAB_CARGO=$env:USERPROFILE\.cargo\bin\cargo.exe" >> $env:GITHUB_ENV
          "RUSTC=$env:USERPROFILE\.cargo\bin\rustc.exe" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-build
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-angleproject
      - name: Build through sdist with UCRT64 Python
        run: |
          /ucrt64/bin/python.exe -m build --no-isolation
          /ucrt64/bin/python.exe scripts/verify-artifacts.py dist
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_release_verification.py' -v
      - name: Test Fusion client and bridge from source
        run: |
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_fusion_connection.py' -v
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_fusion_bridge.py' -v
          PYTHONPATH=src /ucrt64/bin/python.exe -m unittest discover -s tests -p 'test_fusion_wine.py' -v
      - name: Install and test the wheel outside the checkout
        run: |
          export PYGI_DLL_PATH="$(cygpath -w /ucrt64/bin)${PYGI_DLL_PATH:+;$PYGI_DLL_PATH}"
          check_root="$(cygpath -u "$RUNNER_TEMP")/ratiolab-checks"
          /ucrt64/bin/python.exe -m venv --system-site-packages "$check_root/env"
          "$check_root/env/bin/python.exe" -m pip install --no-deps dist/*.whl
          cp scripts/installed_smoke.py tests/test_portability.py tests/test_connection.py tests/test_preview3d.py tests/test_stl_export.py tests/test_agent.py tests/test_mcp.py scripts/check-installed-mcp.py "$check_root/"
          cd "$check_root"
          "$check_root/env/bin/python.exe" installed_smoke.py --forbid-root "$GITHUB_WORKSPACE"
          "$check_root/env/bin/python.exe" check-installed-mcp.py "$check_root/env/bin/python.exe" --module
          "$check_root/env/bin/python.exe" -m unittest test_portability.UserPathsTests test_portability.DispatchTests test_connection test_preview3d test_stl_export test_agent test_mcp -v
      - name: Optional native OpenGL and full workspace check
        if: ${{ inputs.native_gui == true }}
        run: |
          check_root="$(cygpath -u "$RUNNER_TEMP")/ratiolab-checks"
          cd "$check_root"
          "$check_root/env/bin/python.exe" installed_smoke.py --gui --forbid-root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: ratiolab-windows-python-distribution
          path: dist/*

  macos:
    runs-on: macos-15
    env:
      # Keep hosted GTK composition separate from the GLArea renderer proof.
      GSK_RENDERER: cairo
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - name: Select the Homebrew Python that loads GTK
        run: |
          brew install pygobject3 gtk4
          . scripts/macos-python.sh
          python=$(choose_macos_python)
          "$python" -m venv --system-site-packages "$RUNNER_TEMP/ratiolab-env"
          "$RUNNER_TEMP/ratiolab-env/bin/python" -m pip install build 'setuptools>=77' wheel
      - name: Build sdist and wheel from sdist
        run: |
          "$RUNNER_TEMP/ratiolab-env/bin/python" -m build
          "$RUNNER_TEMP/ratiolab-env/bin/python" scripts/verify-artifacts.py dist
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_release_verification.py' -v
      - name: Test Fusion client and bridge from source
        run: |
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_fusion_connection.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_fusion_bridge.py' -v
          PYTHONPATH=src "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest discover -s tests -p 'test_fusion_wine.py' -v
      - name: Install and test the wheel outside the checkout
        run: |
          "$RUNNER_TEMP/ratiolab-env/bin/python" -m pip install --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/ratiolab-checks"
          cp scripts/installed_smoke.py tests/test_portability.py tests/test_connection.py tests/test_preview3d.py tests/test_stl_export.py tests/test_agent.py tests/test_mcp.py scripts/check-installed-mcp.py "$RUNNER_TEMP/ratiolab-checks/"
          cd "$RUNNER_TEMP/ratiolab-checks"
          "$RUNNER_TEMP/ratiolab-env/bin/python" installed_smoke.py --forbid-root "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/ratiolab-env/bin/python" check-installed-mcp.py "$RUNNER_TEMP/ratiolab-env/bin/python" --module
          "$RUNNER_TEMP/ratiolab-env/bin/python" -m unittest test_portability.UserPathsTests test_portability.DispatchTests test_connection test_preview3d test_stl_export test_agent test_mcp -v
      - name: Optional native OpenGL and full workspace check
        if: ${{ inputs.native_gui == true }}
        run: |
          cd "$RUNNER_TEMP/ratiolab-checks"
          "$RUNNER_TEMP/ratiolab-env/bin/python" installed_smoke.py --gui --forbid-root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: ratiolab-macos-python-distribution
          path: dist/*
